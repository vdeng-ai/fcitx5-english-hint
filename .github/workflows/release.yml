name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ubuntu-24-04-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build extra-cmake-modules \
            libfcitx5core-dev libfcitx5config-dev \
            libcurl4-openssl-dev

      - name: Verify tag matches project version
        run: |
          VERSION=$(grep -oP 'project\(fcitx5-english-hint VERSION \K[0-9.]+' CMakeLists.txt)
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Build package
        run: bash scripts/build-deb.sh

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-english-hint-${{ github.ref_name }}-ubuntu24.04-amd64
          path: build-package/fcitx5-english-hint_*.deb
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build-package/fcitx5-english-hint_*.deb \
            --title "Fcitx5 English Hint ${GITHUB_REF_NAME}" \
            --generate-notes

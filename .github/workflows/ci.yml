name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ubuntu-24-04:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build extra-cmake-modules pkgconf \
            libfcitx5core-dev libfcitx5config-dev \
            libcurl4-openssl-dev \
            devscripts debhelper lintian

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Offline tests
        run: ctest --test-dir build --output-on-failure

      - name: Build unsigned Launchpad source package
        run: bash scripts/build-source-package.sh --unsigned

      - name: Lint source package
        run: lintian --fail-on error build-source/*_source.changes
